openapi: 3.0.3
info:
  title: Magii AirLine Admin API
  description: |
    店舗待ち行列管理システムの **管理画面向け** API 仕様。

    ## 設計方針

    - **フィールド名は camelCase**。DB は snake_case なので、変換は
      `server/src/utils/serialize.ts` に集約している。
    - **操作系はすべて `{ success: boolean }` を返す**。更新後の実体は返さないので、
      クライアントは必要に応じて `getTickets` を取り直す。
      失敗理由はボディに載せず、サーバログにのみ残す。
    - **HTTP ステータスは原則 200**。業務的な失敗も `success: false` の 200 で表す
      （ボディで区別しない方針なので、ステータスだけ分けても一貫しないため）。
      500 はサーバ側の想定外エラーのみ。

    ## 変更通知の仕組み

    管理画面は `getEvent` をポーリングし、フラグが立っていれば `getTickets` を
    取り直す。確認したら `resetEvent` で寝かせる。

    | フラグ | 立つ操作 |
    |---|---|
    | `add` | `guest/createTicket` |
    | `remove` | `finishTicket` / `guest/cancelTicket` |
    | `update` | `callNext` / `changeTicketState` / 店舗設定の変更4種 / `guest/arrive` |

    ⚠️ 管理画面を複数台で開くと、片方が `resetEvent` した瞬間にもう片方が変更を
    取りこぼす。1台運用を前提とした設計。

    ## データモデルの前提

    進行中の組と決着した組はテーブルが分かれている。

    - `tickets` … 進行中。`status` は `waiting` / `called` の2値のみ
    - `ticket_history` … 決着済み。`finalState` は `seated` / `no_show` / `cancelled`

    そのため確定は *ステータス更新* ではなく、`tickets` の行を同じ id のまま
    `ticket_history` へ移す `finishTicket` になる。
    `changeTicketState` は `waiting` ↔ `called` の往復専用。

    ## ゲスト向け API

    来店客（アプリ側）向け。`accounts.phoneNumber` + パスワードで `register`/`login` する。
    どちらも成功時は `accountID` を返し、以降の `createTicket`/`getMyTicket` はその
    `accountID` を使う（`register` は電話番号が既に登録済みなら `success: false` になるので
    その場合は `login` を使う）。

    「呼ばれたか / 取り消されたか」を別途ポーリングするAPIは用意していない。
    ゲストが追跡するチケットは常に1件なので、`getMyTicket` を直接ポーリングすれば
    `ticket.status` で waiting/called を判定でき、店舗側の操作で決着した場合は
    `ticket: null` と `finalStatus` で通知される。

    `arrive`（[到着しました]）は `tickets.arrivedAt` に時刻を記録するだけで、
    `status` は変えない。着席確定 (`seated`) は引き続き店舗側の `finishTicket` が行う
    （飲食店の席の準備を想定した設計）。

    ## 認証

    **実装していない。** `login`（admin/guestとも）は照合するだけでトークンを発行しない
    ため、以降のリクエストは `storeID` さえ分かれば誰でも呼べる。ゲストAPIも同様に
    `accountID` / `ticketID` さえ分かれば誰でも呼べる。公開前に必ず塞ぐこと。
  version: 4.0.0

servers:
  - url: http://127.0.0.1:8787
    description: ローカル開発サーバ (server/src/index.ts, `npm run dev`)

tags:
  - name: Admin
    description: 管理者（店舗スタッフ）向けAPI
  - name: Guest
    description: 来店客（アプリ）向けAPI

paths:
  /admin/getTickets:
    get:
      tags: [Admin]
      summary: チケット一覧取得
      description: |
        当日（`businessDate`）の待ち行列を取得する。
        並び順は `called` が先、その後 `waitingNumber` の昇順。

        `tickets` に残っている行はすべて進行中なので、確定済みのチケットは含まれない。

        失敗時（店舗が無い・入力不正・DB エラー）は空配列を返す。
      x-implemented: true
      parameters:
        - $ref: '#/components/parameters/StoreIDQuery'
      responses:
        '200':
          description: 成功（該当なし・失敗いずれも空配列）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTicketsResponse'

  /admin/login:
    post:
      tags: [Admin]
      summary: ログイン
      description: |
        `storeID` で `stores` を引き、`stores.password` を直接照合する
        （パスワードは scrypt ハッシュで保存されている前提）。

        **トークンは発行しない。** 成功しても以降のリクエストが認証済みに
        なるわけではない。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/register:
    post:
      tags: [Admin]
      summary: 店舗の新規作成
      description: |
        `stores` 行を作る唯一の手段。`email`（`store_mail`）の重複は `success: false`。

        `openTime`/`closeTime`/`avgMinutesPerParty`/`counterDate`/`lastNumber`/`status`
        は省略可能で、省略時はDBのデフォルト値が使われる。

        ⚠️ 設計書上のレスポンスは `{ success: boolean }` のみだが、それだと登録後に
        `storeID` を知る手段が無く `login` できないため、実用上の必要性から
        `storeID` も返すようにしている。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegisterRequest'
      responses:
        '200':
          description: '成功時は storeID を含む。失敗時は storeID: null'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRegisterResponse'

  /admin/callNext:
    post:
      tags: [Admin]
      summary: 次を呼ぶ
      description: |
        当日の `waiting` のうち `waitingNumber` が最小のチケットを `called` にし、
        `calledAt` を記録する。

        更新条件に `status = 'waiting'` を含めているため、複数端末から同時に
        押しても同じ組を二重に呼び出すことはない（負けた側は `success: false`）。

        待ち行列が空のときも `success: false`。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreIDBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/getEvent:
    get:
      tags: [Admin]
      summary: イベントの取得
      description: |
        前回の `resetEvent` 以降に変更があったかを返す。ポーリング用。

        行が無い店舗は「イベント無し」として全 `false` を返す。
        入力不正・DB エラーのときも全 `false`。
      x-implemented: true
      parameters:
        - $ref: '#/components/parameters/StoreIDQuery'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventResponse'

  /admin/resetEvent:
    post:
      tags: [Admin]
      summary: イベントのリセット
      description: フロントでイベントを確認したあと、フラグを全て false に戻す。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreIDBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/changeTicketState:
    post:
      tags: [Admin]
      summary: チケットの状態変更
      description: |
        `waiting` ↔ `called` の往復のみ。

        - `called` にすると `calledAt` に現在時刻が入る
        - `waiting` に戻すと `calledAt` は `null` に戻る
        - 既に同じ状態の場合は `success: false`

        `seated` / `no_show` / `cancelled` は **`finishTicket`** の担当。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTicketStateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/finishTicket:
    post:
      tags: [Admin]
      summary: チケットの確定
      description: |
        チケットを確定させる。`tickets` の行を同じ id のまま `ticket_history` へ
        移し、`tickets` から削除する。`createdAt` は引き継がれ、
        `finishedAt` に確定時刻が入る。

        確定済みのチケットを再度指定した場合は `success: false`
        （既に `tickets` から消えているため）。

        `remove` イベントを立てる。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishTicketRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/changeAvgMinutesPerParty:
    post:
      tags: [Admin]
      summary: 平均待ち時間の変更
      description: 1組あたりの想定所要時間（分）を変更する。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAvgMinutesPerPartyRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/changeOpenTime:
    post:
      tags: [Admin]
      summary: 開店時間の変更
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTimeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/changeCloseTime:
    post:
      tags: [Admin]
      summary: 閉店時間の変更
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTimeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/changeStoreState:
    post:
      tags: [Admin]
      summary: 店のステートの変更
      description: |
        `open` / `paused` / `closed` のいずれかに変更する。

        発券を受け付けるのは `open` のときのみ（発券はゲスト API の担当だが、
        DB 上の意味としてはこの通り）。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStoreStateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /guest/register:
    post:
      tags: [Guest]
      summary: ユーザー登録（電話番号+パスワード）
      description: |
        `phone`（`accounts.phoneNumber`）+ `password` でアカウントを新規作成する。
        電話番号は一意制約があるため、既に登録済みなら `success: false` になる
        （その場合は `login` を使う）。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRegisterRequest'
      responses:
        '200':
          description: '成功時は accountID を含む。失敗時は accountID: null'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAuthResponse'

  /guest/login:
    post:
      tags: [Guest]
      summary: ログイン（電話番号+パスワード）
      description: |
        `phone` + `password` で既存アカウントを認証する。`register` と対称。
        以降の `createTicket`/`getMyTicket` はここで得た `accountID` を使う。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestLoginRequest'
      responses:
        '200':
          description: '成功時は accountID を含む。失敗時は accountID: null'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAuthResponse'

  /guest/createTicket:
    post:
      tags: [Guest]
      summary: 発券（予約作成）
      description: |
        `stores.status === 'open'` のときのみ受け付ける。

        同一アカウント・同一店舗・当日のアクティブなチケット（waiting/called）が
        既にあれば、新規作成せずそれをそのまま返す（二重タップ・リトライへの耐性）。

        採番は `callNext` と同様 compare-and-swap 方式で、同時発券でも欠番・重複が
        起きない。`add` イベントを立てる。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '200':
          description: '成功時は ticket を含む。失敗時は ticket: null'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTicketResponse'

  /guest/getMyTicket:
    get:
      tags: [Guest]
      summary: 自分のチケット取得（ポーリング用）
      description: |
        当日の自分のチケットを取得する。ゲスト側のポーリングはこのAPI 1本に統合しており、
        「呼ばれたか/取り消されたか」を別途通知するAPIは無い。

        - チケットが進行中（waiting/called）なら `ticket` に入る。`status` で判定する
        - 店舗側の操作（`finishTicket`）で決着した場合は `ticket: null` になり、
          代わりに当日分の `finalStatus`（seated/no_show/cancelled）が入る
        - 当日まだ何も無ければ両方 `null`
      x-implemented: true
      parameters:
        - name: accountID
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreIDQuery'
      responses:
        '200':
          description: 成功（該当なし・失敗いずれも ticket:null, finalStatus:null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyTicketResponse'

  /guest/cancelTicket:
    post:
      tags: [Guest]
      summary: キャンセル
      description: |
        `waiting` の間のみキャンセル可能（状態遷移図参照）。`called`（呼び出し済み）後は
        `success: false` になる。店舗側の `finishTicket`（no_show 等）に委ねる。

        `remove` イベントを立てる。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketIDBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /guest/arrive:
    post:
      tags: [Guest]
      summary: 到着報告
      description: |
        [到着しました] ボタン。`tickets.arrivedAt` に現在時刻を記録するだけで、
        `status` は変えない。着席確定 (`seated`) は引き続き店舗側の `finishTicket` が行う
        （飲食店の席の準備を想定した設計。要件定義書「未決定事項5」への対応）。

        `update` イベントを立てる。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketIDBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /guest/getStore:
    get:
      tags: [Guest]
      summary: 店舗情報取得（QR読み取り後の表示用）
      description: |
        失敗時（店舗が無い・入力不正・DBエラー）は `store: null` とゼロ値を返す。

        `estimatedWaitMinutes` は `waitingCount * avgMinutesPerParty` の単純計算。
      x-implemented: true
      parameters:
        - $ref: '#/components/parameters/StoreIDQuery'
      responses:
        '200':
          description: 成功（失敗時も200、ゼロ値）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStoreResponse'

  /health:
    get:
      tags: [Admin]
      summary: ヘルスチェック
      description: DB に触らないので、サーバの疎通確認だけに使える。
      x-implemented: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

components:
  parameters:
    StoreIDQuery:
      name: storeID
      in: query
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Success:
      description: |
        処理の成否。失敗理由はボディに含まれない（サーバログを参照）。
        業務的な失敗も 200 で返る。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'

  schemas:
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean

    # ============================================================
    # Entities
    # ============================================================
    TicketStatus:
      type: string
      description: '`tickets.status`。進行中の組のみ。CHECK 制約でこの2値に限定'
      enum:
        - waiting
        - called

    FinalStatus:
      type: string
      description: '`ticket_history.final_status`。CHECK 制約でこの3値に限定'
      enum:
        - seated
        - no_show
        - cancelled

    StoreStatus:
      type: string
      description: '`stores.status`。DB 上は nullable で、`null` は受付不可として扱う'
      nullable: true
      enum:
        - open
        - paused
        - closed

    Account:
      type: object
      description: パスワードは含めない
      properties:
        id:
          type: string
          format: uuid
        phoneNumber:
          type: string
          nullable: true

    Store:
      type: object
      description: |
        `counterDate` / `lastNumber` は発券の採番に使う内部状態で、ゲスト側では使わない。
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: '`stores.store_mail`。ログインに使う店舗のメールアドレス'
        name:
          type: string
        openTime:
          type: string
          example: '10:00:00'
        closeTime:
          type: string
          example: '21:00:00'
        avgMinutesPerParty:
          type: integer
        counterDate:
          type: string
          format: date
          nullable: true
        lastNumber:
          type: integer
        status:
          $ref: '#/components/schemas/StoreStatus'

    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account:
          $ref: '#/components/schemas/Account'
        store:
          $ref: '#/components/schemas/Store'
        businessDate:
          type: string
          format: date
        waitingNumber:
          type: integer
        name:
          type: string
          description: '`tickets.name`。`accounts` に氏名は無いため発券時に受け取った値'
        partySize:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/TicketStatus'
        createdAt:
          type: string
          format: date-time
          description: 管理画面が待ち時間を算出するために使う
        calledAt:
          type: string
          format: date-time
          nullable: true
        arrivedAt:
          type: string
          format: date-time
          nullable: true
          description: '`arrive`（[到着しました]）を押した時刻。status/確定とは独立'

    # ============================================================
    # Requests / Responses
    # ============================================================
    GetTicketsResponse:
      type: object
      required:
        - tickets
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'

    GetEventResponse:
      type: object
      required:
        - add
        - remove
        - update
      properties:
        add:
          type: boolean
        remove:
          type: boolean
        update:
          type: boolean

    StoreIDBody:
      type: object
      required:
        - storeID
      properties:
        storeID:
          type: string
          format: uuid

    LoginRequest:
      type: object
      required:
        - storeID
        - password
      properties:
        storeID:
          type: string
          format: uuid
        password:
          type: string

    AdminRegisterRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 8
        openTime:
          type: string
          example: '10:00:00'
        closeTime:
          type: string
          example: '21:00:00'
        avgMinutesPerParty:
          type: integer
          minimum: 1
          maximum: 120
        counterDate:
          type: string
          format: date
          nullable: true
        lastNumber:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/StoreStatus'

    AdminRegisterResponse:
      type: object
      required:
        - success
        - storeID
      properties:
        success:
          type: boolean
        storeID:
          type: string
          format: uuid
          nullable: true

    ChangeTicketStateRequest:
      type: object
      required:
        - ticketID
        - newState
      properties:
        ticketID:
          type: string
          format: uuid
        newState:
          $ref: '#/components/schemas/TicketStatus'

    FinishTicketRequest:
      type: object
      required:
        - ticketID
        - finalState
      properties:
        ticketID:
          type: string
          format: uuid
        finalState:
          $ref: '#/components/schemas/FinalStatus'

    ChangeAvgMinutesPerPartyRequest:
      type: object
      required:
        - storeID
        - newValue
      properties:
        storeID:
          type: string
          format: uuid
        newValue:
          type: integer
          minimum: 1
          maximum: 120

    ChangeTimeRequest:
      type: object
      required:
        - storeID
        - newValue
      properties:
        storeID:
          type: string
          format: uuid
        newValue:
          type: string
          description: '`HH:MM:SS`。`HH:MM` も受け付け、秒を補って保存する'
          example: '09:30:00'

    ChangeStoreStateRequest:
      type: object
      required:
        - storeID
        - newState
      properties:
        storeID:
          type: string
          format: uuid
        newState:
          type: string
          enum:
            - open
            - paused
            - closed

    # ============================================================
    # Guest Requests / Responses
    # ============================================================
    TicketIDBody:
      type: object
      required:
        - ticketID
      properties:
        ticketID:
          type: string
          format: uuid

    GuestRegisterRequest:
      type: object
      required:
        - phone
        - password
      properties:
        phone:
          type: string
        password:
          type: string
          minLength: 8

    GuestLoginRequest:
      type: object
      required:
        - phone
        - password
      properties:
        phone:
          type: string
        password:
          type: string

    GuestAuthResponse:
      type: object
      required:
        - success
        - accountID
      properties:
        success:
          type: boolean
        accountID:
          type: string
          format: uuid
          nullable: true

    CreateTicketRequest:
      type: object
      required:
        - storeID
        - accountID
        - name
      properties:
        storeID:
          type: string
          format: uuid
        accountID:
          type: string
          format: uuid
        name:
          type: string
        partySize:
          type: integer
          minimum: 1
          maximum: 20

    CreateTicketResponse:
      type: object
      required:
        - success
        - ticket
      properties:
        success:
          type: boolean
        ticket:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Ticket'

    GetMyTicketResponse:
      type: object
      required:
        - ticket
        - finalStatus
      properties:
        ticket:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Ticket'
        finalStatus:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FinalStatus'

    GetStoreResponse:
      type: object
      required:
        - store
        - waitingCount
        - estimatedWaitMinutes
      properties:
        store:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Store'
        waitingCount:
          type: integer
        estimatedWaitMinutes:
          type: integer
