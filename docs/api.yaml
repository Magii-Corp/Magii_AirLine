openapi: 3.0.3
info:
  title: Magii AirLine Admin API
  description: |
    店舗待ち行列管理システムの **管理画面向け** API 仕様。

    ## 設計方針

    - **フィールド名は camelCase**。DB は snake_case なので、変換は
      `server/src/utils/serialize.ts` に集約している。
    - **操作系はすべて `{ success: boolean }` を返す**。更新後の実体は返さないので、
      クライアントは必要に応じて `getTickets` を取り直す。
      失敗理由はボディに載せず、サーバログにのみ残す。
    - **HTTP ステータスは原則 200**。業務的な失敗も `success: false` の 200 で表す
      （ボディで区別しない方針なので、ステータスだけ分けても一貫しないため）。
      500 はサーバ側の想定外エラーのみ。

    ## 変更通知の仕組み

    管理画面は `getEvent` をポーリングし、フラグが立っていれば `getTickets` を
    取り直す。確認したら `resetEvent` で寝かせる。

    | フラグ | 立つ操作 |
    |---|---|
    | `add` | チケットが増えたとき — **現時点では該当なし**（下記） |
    | `remove` | `finishTicket` |
    | `update` | `callNext` / `changeTicketState` / 店舗設定の変更4種 |

    ⚠️ **`add` は当面ずっと `false` のまま**。チケットが増えるのは発券＝ゲスト API の
    担当で、ゲスト API は設計メモ待ちのため未実装。

    ⚠️ 管理画面を複数台で開くと、片方が `resetEvent` した瞬間にもう片方が変更を
    取りこぼす。1台運用を前提とした設計。

    ## データモデルの前提

    進行中の組と決着した組はテーブルが分かれている。

    - `tickets` … 進行中。`status` は `waiting` / `called` の2値のみ
    - `ticket_history` … 決着済み。`finalState` は `seated` / `no_show` / `cancelled`

    そのため確定は *ステータス更新* ではなく、`tickets` の行を同じ id のまま
    `ticket_history` へ移す `finishTicket` になる。
    `changeTicketState` は `waiting` ↔ `called` の往復専用。

    ## ゲスト向け API

    別途設計メモを受け取ってから作る。v2.0.0 にあったゲスト系
    （registerUser / reservation / waiting）は本版で一旦削除した。

    ## 認証

    **実装していない。** `login` は照合するだけでトークンを発行しないため、
    以降のリクエストは `storeID` さえ分かれば誰でも呼べる。公開前に必ず塞ぐこと。
  version: 3.0.0

servers:
  - url: http://127.0.0.1:8787
    description: ローカル開発サーバ (server/src/index.ts, `npm run dev`)

tags:
  - name: Admin
    description: 管理者（店舗スタッフ）向けAPI

paths:
  /admin/getTickets:
    get:
      tags: [Admin]
      summary: チケット一覧取得
      description: |
        当日（`businessDate`）の待ち行列を取得する。
        並び順は `called` が先、その後 `waitingNumber` の昇順。

        `tickets` に残っている行はすべて進行中なので、確定済みのチケットは含まれない。

        失敗時（店舗が無い・入力不正・DB エラー）は空配列を返す。
      x-implemented: true
      parameters:
        - $ref: '#/components/parameters/StoreIDQuery'
      responses:
        '200':
          description: 成功（該当なし・失敗いずれも空配列）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTicketsResponse'

  /admin/login:
    post:
      tags: [Admin]
      summary: ログイン
      description: |
        `storeID` からオーナー（`stores.ownerID` → `staff_accounts`）を引き、
        パスワードを照合する。パスワードは scrypt ハッシュで保存されている前提。

        **トークンは発行しない。** 成功しても以降のリクエストが認証済みに
        なるわけではない。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/callNext:
    post:
      tags: [Admin]
      summary: 次を呼ぶ
      description: |
        当日の `waiting` のうち `waitingNumber` が最小のチケットを `called` にし、
        `calledAt` を記録する。

        更新条件に `status = 'waiting'` を含めているため、複数端末から同時に
        押しても同じ組を二重に呼び出すことはない（負けた側は `success: false`）。

        待ち行列が空のときも `success: false`。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreIDBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/getEvent:
    get:
      tags: [Admin]
      summary: イベントの取得
      description: |
        前回の `resetEvent` 以降に変更があったかを返す。ポーリング用。

        行が無い店舗は「イベント無し」として全 `false` を返す。
        入力不正・DB エラーのときも全 `false`。
      x-implemented: true
      parameters:
        - $ref: '#/components/parameters/StoreIDQuery'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventResponse'

  /admin/resetEvent:
    post:
      tags: [Admin]
      summary: イベントのリセット
      description: フロントでイベントを確認したあと、フラグを全て false に戻す。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreIDBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/changeTicketState:
    post:
      tags: [Admin]
      summary: チケットの状態変更
      description: |
        `waiting` ↔ `called` の往復のみ。

        - `called` にすると `calledAt` に現在時刻が入る
        - `waiting` に戻すと `calledAt` は `null` に戻る
        - 既に同じ状態の場合は `success: false`

        `seated` / `no_show` / `cancelled` は **`finishTicket`** の担当。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTicketStateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/finishTicket:
    post:
      tags: [Admin]
      summary: チケットの確定
      description: |
        チケットを確定させる。`tickets` の行を同じ id のまま `ticket_history` へ
        移し、`tickets` から削除する。`createdAt` は引き継がれ、
        `finishedAt` に確定時刻が入る。

        確定済みのチケットを再度指定した場合は `success: false`
        （既に `tickets` から消えているため）。

        `remove` イベントを立てる。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishTicketRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/changeAvgMinutesPerParty:
    post:
      tags: [Admin]
      summary: 平均待ち時間の変更
      description: 1組あたりの想定所要時間（分）を変更する。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAvgMinutesPerPartyRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/changeOpenTime:
    post:
      tags: [Admin]
      summary: 開店時間の変更
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTimeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/changeCloseTime:
    post:
      tags: [Admin]
      summary: 閉店時間の変更
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTimeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/changeStoreState:
    post:
      tags: [Admin]
      summary: 店のステートの変更
      description: |
        `open` / `paused` / `closed` のいずれかに変更する。

        発券を受け付けるのは `open` のときのみ（発券はゲスト API の担当だが、
        DB 上の意味としてはこの通り）。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStoreStateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /health:
    get:
      tags: [Admin]
      summary: ヘルスチェック
      description: DB に触らないので、サーバの疎通確認だけに使える。
      x-implemented: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

components:
  parameters:
    StoreIDQuery:
      name: storeID
      in: query
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Success:
      description: |
        処理の成否。失敗理由はボディに含まれない（サーバログを参照）。
        業務的な失敗も 200 で返る。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'

  schemas:
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean

    # ============================================================
    # Entities
    # ============================================================
    TicketStatus:
      type: string
      description: '`tickets.status`。進行中の組のみ。CHECK 制約でこの2値に限定'
      enum:
        - waiting
        - called

    FinalStatus:
      type: string
      description: '`ticket_history.final_status`。CHECK 制約でこの3値に限定'
      enum:
        - seated
        - no_show
        - cancelled

    StoreStatus:
      type: string
      description: '`stores.status`。DB 上は nullable で、`null` は受付不可として扱う'
      nullable: true
      enum:
        - open
        - paused
        - closed

    Account:
      type: object
      description: パスワードは含めない
      properties:
        id:
          type: string
          format: uuid
        phoneNumber:
          type: string
          nullable: true

    Store:
      type: object
      description: |
        現在どのエンドポイントも Store 全体は返さないが、型として定義しておく。
        `counterDate` / `lastNumber` は発券の採番に使う内部状態。
      properties:
        id:
          type: string
          format: uuid
        ownerID:
          type: string
          format: uuid
        name:
          type: string
        openTime:
          type: string
          example: '10:00:00'
        closeTime:
          type: string
          example: '21:00:00'
        avgMinutesPerParty:
          type: integer
        counterDate:
          type: string
          format: date
          nullable: true
        lastNumber:
          type: integer
        status:
          $ref: '#/components/schemas/StoreStatus'

    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account:
          $ref: '#/components/schemas/Account'
        storeID:
          type: string
          format: uuid
          description: 一覧で店舗情報が件数分重複するため、ネストせず ID のみ持つ
        businessDate:
          type: string
          format: date
        waitingNumber:
          type: integer
        name:
          type: string
          description: '`tickets.name`。`accounts` に氏名が無いため発券時に受け取った値'
        partySize:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/TicketStatus'
        createdAt:
          type: string
          format: date-time
          description: 管理画面が待ち時間を算出するために使う
        calledAt:
          type: string
          format: date-time
          nullable: true

    # ============================================================
    # Requests / Responses
    # ============================================================
    GetTicketsResponse:
      type: object
      required:
        - tickets
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'

    GetEventResponse:
      type: object
      required:
        - add
        - remove
        - update
      properties:
        add:
          type: boolean
          description: ⚠️ ゲスト API 未実装のため当面ずっと false
        remove:
          type: boolean
        update:
          type: boolean

    StoreIDBody:
      type: object
      required:
        - storeID
      properties:
        storeID:
          type: string
          format: uuid

    LoginRequest:
      type: object
      required:
        - storeID
        - password
      properties:
        storeID:
          type: string
          format: uuid
        password:
          type: string

    ChangeTicketStateRequest:
      type: object
      required:
        - ticketID
        - newState
      properties:
        ticketID:
          type: string
          format: uuid
        newState:
          $ref: '#/components/schemas/TicketStatus'

    FinishTicketRequest:
      type: object
      required:
        - ticketID
        - finalState
      properties:
        ticketID:
          type: string
          format: uuid
        finalState:
          $ref: '#/components/schemas/FinalStatus'

    ChangeAvgMinutesPerPartyRequest:
      type: object
      required:
        - storeID
        - newValue
      properties:
        storeID:
          type: string
          format: uuid
        newValue:
          type: integer
          minimum: 1
          maximum: 120

    ChangeTimeRequest:
      type: object
      required:
        - storeID
        - newValue
      properties:
        storeID:
          type: string
          format: uuid
        newValue:
          type: string
          description: '`HH:MM:SS`。`HH:MM` も受け付け、秒を補って保存する'
          example: '09:30:00'

    ChangeStoreStateRequest:
      type: object
      required:
        - storeID
        - newState
      properties:
        storeID:
          type: string
          format: uuid
        newState:
          type: string
          enum:
            - open
            - paused
            - closed
